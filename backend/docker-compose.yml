services:
  postgres:
    image: postgres:16-alpine
    container_name: evtx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evtx
      POSTGRES_USER: evtx
      POSTGRES_PASSWORD: evtx
    ports:
      - "5433:5432"
    volumes:
      - evtx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evtx -d evtx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  evtx_pgdata:
